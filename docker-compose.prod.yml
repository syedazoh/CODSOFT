services:
  mongo:
    image: mongo:7
    container_name: startup-simulator-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  backend:
    image: ${BACKEND_IMAGE:-startup-simulator-backend:latest}
    container_name: startup-simulator-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB_NAME: startup_simulator
      CHROMA_PERSIST_DIR: /app/chroma_data
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - chroma_data:/app/chroma_data

  frontend:
    image: ${FRONTEND_IMAGE:-startup-simulator-frontend:latest}
    container_name: startup-simulator-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  chroma_data:
